baseurl = "https://essencelearning.in/"
title = "Essence Learning"
theme = "el-theme"
publishDir = "docs"
languageCode = "en-us"
defaultContentLanguage = "en"

disqusShortname = "essencelearningwp"

[services.googleAnalytics]
  ID = "G-NPTFN9RQ9G"

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  unsafe = true

[Permalinks]
  blog = "/blog/:year/:month/:day/:contentbasename/"

# TODO (future): migrate blog permalinks from date-based to slug-only (/blog/:slug/).
# All 25 posts have been reviewed — strategy is clean, no slug conflicts.
# Work involved: 1-line permalink change + aliases on 18 old posts + 9 FAQ link updates.
# New posts in 2026/05 and 2026/06 already have explicit slug frontmatter and need no changes.
# See conversation history for full per-post URL mapping table before making this change.

