{{ define "main" }}
  {{ partial "page-header.html" . }}

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {{ range .Pages }}
      <article class="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-card hover:shadow-card-hover hover:-translate-y-1 transition-all duration-200">
        {{ with .Params.banner }}
        <img src="{{ urls.JoinPath $.Site.BaseURL . }}" alt="{{ $.Title }}"
             class="w-full h-44 object-cover" />
        {{ end }}
        <div class="p-5">
          <h2 class="font-heading font-bold text-el-navy-900 text-lg mb-2">
            <a href="{{ .Permalink }}" class="hover:text-el-amber-600 transition-colors">{{ .Title }}</a>
          </h2>
          <p class="text-gray-500 text-sm leading-relaxed mb-4 line-clamp-3">{{ .Summary | plainify | truncate 120 }}</p>
          <a href="{{ .Permalink }}" class="text-el-amber-600 text-sm font-semibold hover:text-el-amber-700 flex items-center gap-1">
            Read more <i class="fas fa-arrow-right text-xs"></i>
          </a>
        </div>
      </article>
      {{ end }}
    </div>
  </div>
{{ end }}
