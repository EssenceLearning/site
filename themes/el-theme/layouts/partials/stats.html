<!-- Stats Strip -->
<section class="bg-el-navy-900 border-t border-el-navy-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">

      <div class="flex flex-col items-center gap-1">
        <span class="font-heading text-3xl font-extrabold text-el-amber-400">{{ .Site.Params.stat1_number }}</span>
        <span class="text-sm font-medium text-gray-500">{{ .Site.Params.stat1_label }}</span>
      </div>

      <div class="flex flex-col items-center gap-1">
        <span class="font-heading text-3xl font-extrabold text-el-amber-400">{{ .Site.Params.stat2_number }}</span>
        <span class="text-sm font-medium text-gray-500">{{ .Site.Params.stat2_label }}</span>
      </div>

      <div class="flex flex-col items-center gap-1">
        <span class="font-heading text-3xl font-extrabold text-el-amber-400">{{ .Site.Params.stat3_number }}</span>
        <span class="text-sm font-medium text-gray-500">{{ .Site.Params.stat3_label }}</span>
      </div>

      <div class="flex flex-col items-center gap-1">
        <span class="font-heading text-3xl font-extrabold text-el-amber-400">{{ .Site.Params.stat4_number }}</span>
        <span class="text-sm font-medium text-gray-500">{{ .Site.Params.stat4_label }}</span>
      </div>

    </div>
  </div>
</section>
