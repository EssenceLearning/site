<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>{{ if .IsHome }}{{ .Site.Title }} — Aviation &amp; Hospitality Training, Bangalore{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.defaultDescription }}{{ end }}" />
  <meta name="keywords" content="{{ with .Keywords }}{{ delimit . ", " }}{{ else }}{{ delimit .Site.Params.defaultKeywords ", " }}{{ end }}" />
  <meta name="author" content="{{ .Site.Params.author }}" />

  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.defaultDescription }}{{ end }}" />
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
  <meta property="og:url" content="{{ .Permalink }}" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ urls.JoinPath .Site.BaseURL "img/favicon.svg" }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ urls.JoinPath .Site.BaseURL "img/favicon.png" }}" />
  <link rel="shortcut icon" href="{{ urls.JoinPath .Site.BaseURL "favicon.ico" }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ urls.JoinPath .Site.BaseURL "img/apple-touch-icon.png" }}" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'el-navy': {
              950: '#04091a',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
            },
            'el-sky': {
              700: '#0369a1',
              600: '#0284c7',
              500: '#0ea5e9',
              400: '#38bdf8',
              300: '#7dd3fc',
              100: '#e0f2fe',
            },
            'el-amber': {
              700: '#b45309',
              600: '#d97706',
              500: '#f59e0b',
              400: '#fbbf24',
              300: '#fcd34d',
              200: '#fde68a',
              100: '#fef3c7',
              50:  '#fffbeb',
            },
          },
          fontFamily: {
            sans:    ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 2px 12px 0 rgba(15,23,42,0.08)',
            'card-hover': '0 8px 30px 0 rgba(15,23,42,0.14)',
          },
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Global styles not easily expressible in Tailwind utilities -->
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
    /* Smooth scroll */
    html { scroll-behavior: smooth; }
    /* Prose styles for blog/content pages */
    .el-prose h2 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-top: 2rem; margin-bottom: 0.75rem; }
    .el-prose h3 { font-size: 1.2rem; font-weight: 700; color: #0f172a; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    .el-prose h4 { font-size: 1rem; font-weight: 600; color: #334155; margin-top: 1.25rem; margin-bottom: 0.4rem; }
    .el-prose p  { color: #475569; line-height: 1.75; margin-bottom: 1rem; }
    .el-prose ul { list-style: disc; padding-left: 1.5rem; color: #475569; margin-bottom: 1rem; }
    .el-prose ul li { margin-bottom: 0.35rem; line-height: 1.65; }
    .el-prose ol { list-style: decimal; padding-left: 1.5rem; color: #475569; margin-bottom: 1rem; }
    .el-prose a  { color: #d97706; text-decoration: underline; }
    .el-prose a:hover { color: #b45309; }
    .el-prose hr { border-color: #e2e8f0; margin: 1.5rem 0; }
    .el-prose strong { color: #0f172a; }
    .el-prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .el-prose th { background: #f1f5f9; padding: 0.5rem 0.75rem; text-align: left; font-weight: 600; border: 1px solid #e2e8f0; }
    .el-prose td { padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; color: #475569; }
    /* Anchor offset for sticky nav */
    .anchor { display: block; height: 80px; margin-top: -80px; visibility: hidden; }
    /* Course accordion */
    [x-cloak] { display: none !important; }
  </style>

  <!-- Google Analytics (supports both legacy and new Hugo config) -->
  {{- $gaID := "" -}}
  {{- with .Site.Config.Services.GoogleAnalytics.ID -}}{{- $gaID = . -}}{{- end -}}
  {{- if eq $gaID "" -}}{{- with .Site.GoogleAnalytics -}}{{- $gaID = . -}}{{- end -}}{{- end -}}
  {{ with $gaID }}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ . }}');
  </script>
  {{ end }}
</head>
