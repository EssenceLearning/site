<!-- Inner Page Header -->
<section class="relative py-14 md:py-20 overflow-hidden"
         style="background: linear-gradient(135deg, #0f172a 0%, #1c1205 45%, #92400e 100%);">
  <!-- subtle dot-grid overlay -->
  <div class="absolute inset-0 opacity-10"
       style="background-image: radial-gradient(circle, #fde68a 1px, transparent 1px); background-size: 28px 28px;"></div>
  <!-- bottom fade -->
  <div class="absolute bottom-0 left-0 right-0 h-10"
       style="background: linear-gradient(to bottom, transparent, rgba(15,23,42,0.15));"></div>

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <!-- Breadcrumb -->
      <nav class="flex items-center gap-2 text-sm text-sky-400/70 mb-4">
        <a href="{{ .Site.BaseURL }}" class="hover:text-sky-300 transition-colors">Home</a>
        <i class="fas fa-chevron-right text-xs text-sky-600"></i>
        <span class="text-sky-200/80">{{ .Title }}</span>
      </nav>
      <h1 class="font-heading text-3xl md:text-4xl font-extrabold text-white mb-3 drop-shadow">{{ .Title }}</h1>
      {{ with .Description }}
      <p class="text-sky-100/70 text-base leading-relaxed">{{ . }}</p>
      {{ end }}
    </div>
  </div>
</section>
