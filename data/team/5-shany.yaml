name: "Shany Nupur Topno"
position: "Aviation / Customer Service Trainer"
image: "img/team/shany.jpg"
bio: "Shany has 10 years of customer service experience across the 5-star hotel and airline industry. She served Jet Airways as a Flight Attendant for 8 years and as Inflight Manager / Nodal Officer with Air Pegasus. She also has hands-on experience at The Park Hotel, Kolkata in the Food and Beverage department, and imparts training to students in customer service, communication skills and the aviation industry."
