name: "Neeraj Yadav"
position: "Coordinator / Administrator"
image: "img/team/neeraj.jpg"
bio: "Neeraj has 10 years of aviation experience. She started her career with Air Deccan as Cabin Crew, continued with Kingfisher as CCIC and served as Check CCIC with Air Pegasus — training cabin crew on board and releasing them for flight duties. At Essence Learning she ensures high standards of industry grooming and code of conduct among new trainees, making sure every student is fully prepared before their job interview."
