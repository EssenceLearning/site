name: "Shueab Mujawar"
position: "Aviation / Chief Mentor"
image: "img/team/sm.jpg"
bio: |
  A veteran with more than 3 decades of cross-industry experience. Served in the Indian Navy for 15 years as a maintenance Artificer, retiring as a Junior Commissioned Officer. Subsequently worked at HAL Air India (JWG) as a Technical Officer at Bangalore International Airport, and as Faculty at Hindustan Aviation Academy (DGCA approved AME institute). Held roles at Air India SATS (BIAL) as Maintenance Supervisor, and at SIKA Inter Plant Systems on aerospace domain evaluation for HAL, DRDO and ISRO projects.

  An expert in Airfield Fire Fighting, Airside Driving, Apron Safety, ISAGO, and First Aid training for aviation personnel.
