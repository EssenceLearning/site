bio: "Rakesh has over 5 years of experience in leadership coaching and soft skills development, working with people from organisations like Rolls-Royce, Airbus, GE and Exxon Mobil. He has helped 1,000+ people unlock their true potential through self-discovery and goal identification — accumulating 10,000+ training hours. He also holds Six Sigma Black Belt expertise and assists companies with process reengineering projects."
