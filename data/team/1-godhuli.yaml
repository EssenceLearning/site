name: "Godhuli Raman"
position: "Founder"
image: "img/team/godhuli.jpg"
bio: |
  Godhuli is an Aviation enthusiast and veteran who aims to fill the gap between industry-required competences and current trainee knowledge through quality, affordable training. Her decade of experience spans from a Five Star Hotel Executive to an Inflight Manager. She began at The Park Hotel, New Delhi and was part of the pilot team at Shangri-la Hotel, before joining Air Deccan (later Kingfisher) as an Air Hostess — promoted to Senior Inflight Manager within a year, with around four thousand hours of flying experience as a Cabin Crew Member.

  She trained Junior Cabin Crew on Check Flights covering Safety, First Aid, Fire Fighting, Bomb Threat, Hijack, Survival, Dangerous Goods Regulations, AVSEC, Ground Handling and Emergency Procedures. She holds D.G.C.A. certifications and has trained hundreds of students across Aviation and Hospitality institutes in Bangalore.
