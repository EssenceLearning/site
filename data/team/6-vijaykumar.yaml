name: "Vijay Kumar"
position: "Leadership Coach"
image: "img/team/vijaykumar.jpg"
bio: |
  An industry veteran with 30+ years of rich experience spanning cost estimation, project management, quality assurance and heading operations as Sr. VP — managing teams of up to 1,350 people. Passionate about inclusive leadership and building highly effective teams through initiatives like Book Review Club, Fun Friday and Speak-Up.

  Vijay holds an Engineering degree and a Masters in Marketing. He is a GE-certified Green Belt in Six Sigma and a Project Management Professional (PMP) from PMI, Pennsylvania, and has completed Dale Carnegie's Train the Trainer programme. He has presented papers at ASTD conferences in Washington and Chicago (2009 & 2010) alongside Phil Jackson on "A Passage to India".
