name: "Charmee Arora"
position: "Grooming / Image Consultant"
image: "img/team/charmee.jpg"
bio: |
  A certified Image Consultant, etiquette coach and soft skills trainer, trained under the curriculum of Conselle Institute of Image Management, USA (founded by Judith Rasband). With a background in event management, Charmee is passionate about guiding students on human relations, clothing, grooming and creating lasting first impressions.

  She works on visual, communication and soft skills to help each student project an authentic, appropriate and attractive image — helping them be the best version of themselves.
