name: "Jude Martin"
position: "Hospitality / Tourism Trainer"
image: "img/team/jude.jpg"
bio: "Jude completed his studies in Hospitality and Tourism at Farnborough College of Technology, UK, and holds a Diploma in Travel and Tourism from ICS Canada / IITC Bangalore. He is trained in the IATA Standard Course (Geneva) and Galileo India (General Systems Course, Air Travel ABTA London certified). With 15 years of industry experience, he is associated with Essence Learning as a Hospitality Trainer."
