# ── Aviation courses ───────────────────────────────────────────────────────────
- id: aviation-hospitality
  name: Aviation & Hospitality Management
  icon: "fa fa-plane"
  duration: "3–12 months"
  description: "The most comprehensive track — covers Inflight service, Airport Ground Handling and Hotel Hospitality in one programme."
  eligibility:
    - "Age: 18–27 years (relaxable by 3 years for SC/ST/OBC for Indian carriers)"
    - "Qualification: 10+2 or Graduate in any discipline from a recognised university"
    - "Height: Female min. 5 ft 2 in | Male min. 5 ft 5 in"
    - "Weight: In proportion to height"
    - "Vision: Normal eyesight"
    - "Language: Fluency in English and Hindi; regional language an advantage"
  modules:
    - "Introduction to Aviation, Airline Departments and Regulatory Authorities"
    - "Crew Healthy Living, Lifestyle and Aircraft Familiarisation"
    - "Ground and Inflight Handling — Baggage, IATA Codes and Emergency Systems"
    - "Fire Fighting, First Aid, Dangerous Goods, Security, Evacuations and Survival"
    - "Airport and Aircraft Security — Basic AvSec"
    - "Hotel Hospitality Management (refer Hospitality syllabus)"
    - "Grooming, Personality Development, Communication and Interview Skills"
  iata:
    - "Basic Air Side Safety"
    - "Introduction to Safety Management Systems"
    - "Dangerous Goods Regulations (Cabin Crew, Cargo, Passenger Handling)"
    - "Geography in Travel Planning"
    - "Introduction to BSP Link"
    - "Smart Amadeus / Galileo / Sabre — GDS Reservations"
    - "Destination Geography and Serving the Travel Customer"

