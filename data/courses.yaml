# ── Hospitality ────────────────────────────────────────────────────────────────
- id: hospitality
  name: Hotel & Hospitality Management
  icon: "fas fa-concierge-bell"
  duration: "3–12 months"
  description: "Covers hotel management, front-desk and back-office operations. Includes dedicated internship and placement support in star hotels."
  eligibility:
    - "Aspirants or working professionals in the hospitality sector looking to enhance their industry knowledge"
  modules:
    - "Hospitality, Hotel Industry and Tourism"
    - "Hotel Departments and Interdepartmental Coordination"
    - "Hotel Abbreviations, Formulas, Reports, Night Audits and Cashiering"
    - "Hierarchy, Trends, Technology, Service, First Aid, Fire and Food Science"
    - "Environmental Studies, Facilities Planning, Sales and Marketing, Management Techniques"
    - "Body Language, Grooming, Interpersonal Skills and Interview Preparation"
  highlight: "We assist in domestic and international internship and placements in star hotels."

