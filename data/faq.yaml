- q: "1. I cannot speak an additional language — will this hold me back from being hired as cabin crew or Airport Staff?"
  a: "Not at all. Speaking an additional language is not essential to become cabin crew or airport staff, although it is desirable. Fluency in English and Hindi is a must for domestic airlines. For international carriers, fluency in English is mandatory, and knowledge of any regional or foreign language is an added advantage."

- q: "2. I never excelled at school — am I eligible to get hired as Airline Crew or Hotel Staff?"
  a: "The industry understands that not every prospective candidate excels at school, but many have the required skills and qualities. If you did not gain top marks but have cleared higher secondary education, or have customer service experience, airlines and hotels will still consider you."

- q: "3. Do I have to live close to the airport I would be based at?"
  a: "The candidate will be required to live within a certain distance from the airport they are based at. Most airlines set a maximum of a 60-minute travel time radius. This is because crew can be rostered on standby and may be called at short notice. Being close to the airport also saves considerable fatigue after long shifts."

- q: "4. How much would I earn as cabin crew, Airport Ground Staff or Hotel Executive?"
  a: |
    **International Airlines**

    - Flight Attendants / Air Hostess: Rs 70,000 – 1,50,000 per month *(initial 1–2 years, depending on performance, grade and duty hours)*
    - Ground Crew: Rs 25,000 – Rs 60,000 per month
    - Hotel Executive: Rs 20,000 onwards

    **Domestic Airlines**

    - Flight Attendant / Air Hostess: Rs 30,000 – 60,000 per month *(initial 1–2 years)*
    - Ground Crew: Rs 12,000 – Rs 25,000 per month

    In addition to base pay, cabin crew typically receive long haul bonuses, a daily overseas allowance, nightly incidental allowance, meal allowance, excess hours premium, telephone allowance, commission on duty-free and on-board sales, and stand-by allowance. Allowances vary by airline. Employees also receive free or discounted air tickets for themselves and family.

    **Hotel Executive:** Rs 8,000 – Rs 20,000 onwards, plus allowances, tips, and performance bonuses.

- q: "5. I wear glasses — can I still work as cabin crew or Airport / Hotel Staff?"
  a: "Yes. Airlines and hotels are fine about recruiting people who wear contact lenses or glasses, provided these correct vision to 20/20. There are certain restrictions for cabin crew applicants, and corrective surgery is generally not accepted due to in-flight safety requirements."

- q: "6. Do I need to complete a course before applying?"
  a: "A prior qualification is not mandatory, but airlines and hotels strongly prefer candidates who have basic knowledge of the role and familiarity with industry reservation systems. Undergoing a course before applying boosts confidence, sharpens interview performance, and significantly increases your chances of selection."

- q: "7. What job opportunities can I expect in this sector?"
  a: |
    - **Airline Industry:** Traffic Assistants, Reservation and Counter Executives, Air Hostess / Flight Stewards, Sales Executives, Airport Duty Personnel, Call Centre Staff
    - **Travel Agencies and Tour Operators:** Reservation and Counter Executives, Sales and Marketing Executives
    - **Hotels:** Travel Consultants, Front Office Executives / Assistants, Reservation Executives, Restaurant Hostess, Relationship Managers

- q: "8. Do I have to be a certain minimum age to enrol on a course?"
  a: "To enrol on any of our vocational courses, a candidate normally needs to be at least 18 years old. You should also be aware of the minimum age requirements set by individual airlines when applying for jobs."

- q: "9. What is the minimum age to apply as a cabin crew member?"
  a: "Most airlines set a minimum age of 18 to 21 for cabin crew applicants. The upper age limit varies by airline and is generally relaxable for candidates with prior cabin crew experience."

- q: "10. When is the best time to apply for a cabin crew, Airport or Hotel Staff job?"
  a: "Recruitment drives tend to run throughout the year. Some charter airlines and budget hotels recruit more heavily at the start of the year for the busy summer season, so keeping an eye on airline career portals year-round is advisable."

- q: "11. What kind of questions can I expect at interview?"
  a: "You will typically be asked about your customer service experience, how you handle difficult situations, your knowledge of the role, and your motivation for joining the aviation or hospitality industry. Preparing with mock interviews and reviewing common interview questions significantly improves your chances."

- q: "12. What happens during the induction course once I am recruited?"
  a: |
    **Airline / Cabin Crew:** Once recruited, you complete a mandatory 6–12 week safety and emergency procedure training covering:

    - Aircraft Evacuation
    - Ditching (landing on water)
    - Decompression
    - Fire Fighting
    - Passenger Management
    - Security / Bomb Threat / Hijack
    - Extraordinary Situations
    - First Aid and Survival

    After training, you appear for written and mock examinations conducted by DGCA to obtain your licence to work in the industry.

    **Hotel Staff:** Induction involves one to two months of cross-departmental training across Reception, F&B, Housekeeping and Reservations, giving you a thorough understanding of hotel operations before you begin handling your assigned department.

- q: "13. Which airline would suit me best?"
  a: |
    It is a personal decision. Useful factors to research before applying:

    - **Company size** — small and friendly, or large corporate?
    - **Destinations** — short-haul, long-haul or both?
    - **Incentives** offered to cabin crew
    - **Career progression** opportunities within the company

- q: "14. I applied to an airline and was not accepted — can I apply again?"
  a: "Normally you can re-apply after 6 months. Many successful cabin crew were rejected on their first attempt. Use the 6-month period to build customer service experience, improve your knowledge, and refine your interview skills."
